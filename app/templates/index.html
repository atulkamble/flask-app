<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08111f">
    <title>Flask Workspace</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #08111f;
            --panel: rgba(18, 31, 52, 0.78);
            --panel-border: rgba(255, 255, 255, 0.09);
            --text: #f7f9fc;
            --muted: #9ba9bd;
            --accent: #78e6c1;
            --accent-strong: #50cfa7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 10%, rgba(57, 113, 138, 0.28), transparent 28rem),
                radial-gradient(circle at 85% 80%, rgba(74, 159, 137, 0.12), transparent 24rem),
                var(--bg);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, black, transparent 75%);
        }

        .shell {
            width: min(1120px, calc(100% - 40px));
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        nav {
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.055);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .brand-mark svg {
            width: 20px;
            color: var(--accent);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.035);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 420px;
            align-items: center;
            gap: 64px;
            padding: 48px 0 96px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 28px;
            height: 1px;
            background: var(--accent);
        }

        h1 {
            max-width: 700px;
            margin: 22px 0 18px;
            font-size: clamp(3.5rem, 8vw, 6.8rem);
            line-height: 0.92;
            letter-spacing: -0.065em;
        }

        h1 span {
            color: var(--accent);
        }

        .lead {
            max-width: 560px;
            margin: 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.15rem);
            line-height: 1.75;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 34px;
        }

        .button {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border-radius: 12px;
            padding: 0 18px;
            color: var(--text);
            text-decoration: none;
            font-weight: 750;
            font-size: 0.9rem;
            border: 1px solid var(--panel-border);
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .button:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .button-primary {
            background: var(--accent);
            color: #092019;
            border-color: var(--accent);
        }

        .button-primary:hover {
            background: #8af0ce;
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.045);
        }

        .button svg {
            width: 16px;
            height: 16px;
        }

        .panel {
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 12px;
            background: var(--panel);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px);
        }

        .terminal {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            background: rgba(6, 13, 24, 0.72);
        }

        .terminal-bar {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .lights {
            display: flex;
            gap: 6px;
        }

        .light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a4657;
        }

        .terminal-title {
            color: #738198;
            font-size: 0.72rem;
        }

        .terminal-body {
            min-height: 280px;
            padding: 24px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.82rem;
            line-height: 2;
        }

        .prompt {
            color: var(--accent);
        }

        .code-muted {
            color: #728198;
        }

        .response {
            display: block;
            color: #d8e1ed;
        }

        footer {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #64738a;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 860px) {
            main {
                grid-template-columns: 1fr;
                gap: 48px;
                align-content: center;
                padding-top: 64px;
            }

            .panel {
                max-width: 520px;
            }

            h1 {
                font-size: clamp(3.4rem, 16vw, 5.7rem);
            }
        }

        @media (max-width: 520px) {
            .shell {
                width: min(100% - 28px, 1120px);
            }

            nav {
                height: 72px;
            }

            .status {
                padding: 8px;
            }

            .status span:last-child {
                display: none;
            }

            main {
                padding: 52px 0 64px;
            }

            h1 {
                font-size: clamp(3.2rem, 18vw, 4.5rem);
            }

            footer {
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <nav>
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 3 4.5 7.2v9.6L12 21l7.5-4.2V7.2L12 3Z"/>
                        <path d="m4.5 7.2 7.5 4.3 7.5-4.3M12 11.5V21"/>
                    </svg>
                </div>
                Flask
            </div>
            <div class="status" id="service-status">
                <span class="status-dot"></span>
                <span>Checking status</span>
            </div>
        </nav>

        <main>
            <section>
                <div class="eyebrow">Python service</div>
                <h1>Hello, <span>World!</span></h1>
                <p class="lead">
                    A lightweight Flask workspace, ready to build into a focused and dependable web experience.
                </p>
                <div class="actions">
                    <a class="button button-primary" href="/health">
                        Check health
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M13 6l6 6-6 6"/>
                        </svg>
                    </a>
                    <a class="button button-secondary" href="https://flask.palletsprojects.com/" target="_blank" rel="noreferrer">
                        Flask docs
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 5h5v5M19 5l-8 8M19 13v6H5V5h6"/>
                        </svg>
                    </a>
                </div>
            </section>

            <aside class="panel" aria-label="Server response preview">
                <div class="terminal">
                    <div class="terminal-bar">
                        <div class="lights" aria-hidden="true">
                            <span class="light"></span>
                            <span class="light"></span>
                            <span class="light"></span>
                        </div>
                        <span class="terminal-title">GET /health</span>
                        <span></span>
                    </div>
                    <div class="terminal-body">
                        <div><span class="prompt">$</span> curl localhost:5000/health</div>
                        <span class="response" id="terminal-response">Connecting...</span>
                        <div class="code-muted">HTTP/1.1 200 OK</div>
                        <div class="code-muted">Content-Type: text/html</div>
                    </div>
                </div>
            </aside>
        </main>

        <footer>
            <span>Flask app</span>
            <span>Running locally</span>
        </footer>
    </div>

    <script>
        async function refreshHealth() {
            const status = document.querySelector("#service-status");
            const statusText = status.querySelector("span:last-child");
            const response = document.querySelector("#terminal-response");

            try {
                const result = await fetch("/health");
                if (!result.ok) throw new Error("Service unavailable");
                const text = await result.text();
                statusText.textContent = "Service healthy";
                response.textContent = text;
            } catch (error) {
                statusText.textContent = "Service offline";
                response.textContent = "Service unavailable";
            }
        }

        refreshHealth();
    </script>
</body>
</html>
